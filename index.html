<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>

  <!-- Q版人物 -->
  <img class="character left" src="lei.png" alt="雷淞然" id="lei">
  <img class="character right" src="zhang.png" alt="张呈" id="zhang">

  <!-- 中间按钮 -->
  <a href="/home">
    <button class="center-btn">💕 进入小力士宇宙 💕</button>
  </a>

  <script>
    // 对话库
    const leiWords = [
      '雷淞然：大家好，我是雷淞然',
      '雷淞然：在被否定时，沉下心钻研',
      '雷淞然：好剧本永远难写，好心情能抗事',
      '雷淞然：及时行乐 所有事情都没有想象的那么重要'
    ];
    const zhangWords = [
      '张呈：大家好，我是张呈',
      '张呈：因为我们俩其实共苦过嘛，所以说以后也想同甘',
      '张呈：这个本子如果是张呈跟雷淞然演就更好了',
     '张呈：放弃是比坚持更难的东西'
    ];

     let leiIndex = 0; 
    let zhangIndex = 0;

    // 显示气泡
    function showBubble(text, side) {
      document.querySelectorAll('.bubble').forEach(el => el.remove());
      
      let bubble = document.createElement('div');
      bubble.className = `bubble bubble-${side}`;
      bubble.textContent = text;
      document.body.appendChild(bubble);
      
      setTimeout(() => bubble.remove(), 3500);
    }

    // 点击人物事件
    document.getElementById('lei').addEventListener('click', function() {
      // 改用索引取值，保证顺序轮换，不会重复
      const text = leiWords[leiIndex % leiWords.length]; 
      leiIndex++; // 每次点击索引+1
      showBubble(text, 'left');
    });

    document.getElementById('zhang').addEventListener('click', function() {
      // 改用索引取值，保证顺序轮换，不会重复
      const text = zhangWords[zhangIndex % zhangWords.length];
      zhangIndex++; // 每次点击索引+1
      showBubble(text, 'right');
    });

  

    // 背景飘落爱心（氛围感）
    setInterval(() => {
      let heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤️';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.top = '-30px';
      heart.style.fontSize = (20 + Math.random() * 20) + 'px';
      document.body.appendChild(heart);
      
      let fall = setInterval(() => {
        let top = parseFloat(heart.style.top);
        if (top > window.innerHeight) {
          clearInterval(fall);
          heart.remove();
        } else {
          heart.style.top = top + 2 + 'px';
          heart.style.left = parseFloat(heart.style.left) + (Math.random() - 0.5) * 0.5 + 'px';
        }
      }, 30);
    }, 500);

     // ===== 双击空白出现正中央“小力士”文字，2秒变大消失 =====
    let textTimer = null; 
    
    document.addEventListener('dblclick', function(e) {
      // 如果点击的是人物、按钮、原有文字，不触发
      if (e.target.closest('.character') || e.target.closest('.center-btn') || e.target.closest('.center-text')) {
        return;
      }
      
      // 如果有旧文字先删掉，防止文字叠在一起
      const existingText = document.querySelector('.center-text');
      if (existingText) {
        existingText.remove();
        clearTimeout(textTimer);
      }
      
      // 创建正中央文字
      let text = document.createElement('div');
      text.className = 'center-text';
      text.textContent = '大家好，我们是小力士！ 💫';
      document.body.appendChild(text);
      
      // 2秒动画结束后，从页面彻底移除文字元素
      textTimer = setTimeout(() => {
        if (text.parentNode) {
          text.remove();
          textTimer = null;
        }
      }, 2000);
    });
  </script>

  <!-- 导航栏 -->
   <div class="top-nav">   
    <div class="nav-logo">小力士</div>
    <div class="nav-menu">     
      <a href="#">简介</a >       
      <a href="#">荣誉</a >      
      <a href="#">商务</a >       
      <a href="#">合作</a >
      <a href="#">变换形态</a >      
      <div class="nav-icon-group">        
        <span>🔍</span>    
        <span>☰</span>       
      </div>   
    </div>
  </div>

</body>
</html>
